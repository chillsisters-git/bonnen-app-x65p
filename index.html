<script>
// ===== Overgenomen uit de bestaande app (zelfde regels voor koppelen, fooi, inlezen) =====
function fmt(n){return '€ '+parseFloat(n||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseAmt(s){return parseFloat((s||'0').toString().replace(/[€\s]/g,'').replace(',','.'))||0;}
function matchRekening(gevonden){
  if(!gevonden) return null;
  var s=gevonden.toString().replace(/\s/g,'');
  for(var i=0;i<REKENINGEN.length;i++){if(s.indexOf(REKENINGEN[i].cijfers)>=0)return REKENINGEN[i].naam;}
  return null;
}
function parseDatumNL(d){
  if(!d) return null;
  var p=(''+d).trim().split(/[-\/]/); // ondersteunt zowel "-" als "/" als scheidingsteken
  if(p.length!==3) return null;
  var jaar=parseInt(p[2],10),maand=parseInt(p[1],10),dag=parseInt(p[0],10);
  if(!jaar||!maand||!dag) return null;
  return new Date(jaar,maand-1,dag);
}
function dagVerschil(d1,d2){
  var a=parseDatumNL(d1),b=parseDatumNL(d2);
  if(!a||!b) return null;
  return Math.abs((a-b)/86400000);
}
function pad2(n){n=''+n;return n.length<2?'0'+n:n;}
function sorteerOpDatumDesc(lijst){
  return lijst.slice().sort(function(a,b){
    var da=parseDatumNL(a.datum),db=parseDatumNL(b.datum);
    if(!da&&!db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return db-da;
  });
}
function detectDelimiter(line){
  var semi=(line.match(/;/g)||[]).length;
  var comma=(line.match(/,/g)||[]).length;
  return semi>=comma?';':',';
}
function splitCsvLine(line,delim){
  var result=[],cur='',inQuotes=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQuotes=!inQuotes;continue;}
    if(ch===delim&&!inQuotes){result.push(cur);cur='';continue;}
    cur+=ch;
  }
  result.push(cur);
  return result;
}
function normaliseerDatum(raw){
  if(!raw) return null;
  raw=raw.trim();
  if(/^\d{8}$/.test(raw)) return raw.substr(6,2)+'-'+raw.substr(4,2)+'-'+raw.substr(0,4);
  var m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+'-'+m[2]+'-'+m[1];
  m=raw.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m) return pad2(m[1])+'-'+pad2(m[2])+'-'+m[3];
  return null;
}
function normaliseerBedrag(raw){
  if(!raw) return 0;
  raw=raw.trim().replace(/[€\s]/g,'');
  if(/,\d{1,2}$/.test(raw)) raw=raw.replace(/\./g,'').replace(',','.');
  return parseFloat(raw)||0;
}
function vindKolom(header,mogelijkeNamen){
  for(var i=0;i<header.length;i++){
    for(var j=0;j<mogelijkeNamen.length;j++){
      if(header[i].indexOf(mogelijkeNamen[j])>=0) return i;
    }
  }
  return -1;
}
function vindEigenRekeningKolom(header){
  var voorkeur=['iban','rekeningnummer','rekening','accountnumber','account'];
  for(var i=0;i<header.length;i++){
    var kop=header[i].replace(/\s/g,'');
    if(kop.indexOf('tegen')>=0) continue;
    for(var j=0;j<voorkeur.length;j++){
      if(kop.indexOf(voorkeur[j])>=0) return i;
    }
  }
  return -1;
}
function laatste4Cijfers(raw){
  if(!raw) return '';
  var digits=(''+raw).replace(/[^0-9]/g,'');
  return digits.length>=4?digits.slice(-4):digits;
}
function parseBankCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim().length;});
  if(!lines.length) return [];
  var delim=detectDelimiter(lines[0]);
  var header=splitCsvLine(lines[0],delim).map(function(h){return h.trim().toLowerCase();});
  var idxDatum=vindKolom(header,['transactiedatum','datum','date','completed date','started date']);
  var idxBedrag=vindKolom(header,['bedrag (eur)','bedrag','amount']);
  var idxOmschrijving=vindKolom(header,['naam / omschrijving','omschrijving','naam tegenpartij','description','mededelingen']);
  var idxAfBij=vindKolom(header,['af bij','af/bij']);
  var idxRekening=vindEigenRekeningKolom(header);
  var result=[];
  for(var r=1;r<lines.length;r++){
    if(idxDatum<0||idxBedrag<0) break;
    var cols=splitCsvLine(lines[r],delim);
    var datum=normaliseerDatum(cols[idxDatum]);
    var bedragRaw=normaliseerBedrag(cols[idxBedrag]);
    var type;
    if(idxAfBij>=0){
      type=((cols[idxAfBij]||'').trim().toLowerCase()==='af')?'af':'bij';
    } else {
      type=bedragRaw<0?'af':'bij';
    }
    if(!datum) continue;
    result.push({
      id:'tx'+r+'-'+Date.now(),
      datum:datum,
      bedrag:Math.abs(bedragRaw),
      type:type,
      omschrijving:idxOmschrijving>=0?(cols[idxOmschrijving]||'').trim():'',
      rekening:idxRekening>=0?laatste4Cijfers(cols[idxRekening]):''
    });
  }
  return result;
}
function matchTransacties(){
  matchesByBonId={};
  matchesByTxId={};
  var twijfel={};

  Object.keys(handmatigeKoppelingen).forEach(function(txId){
    var bonId=handmatigeKoppelingen[txId];
    var bonBestaat=bonnen.some(function(b){return b.id===bonId;});
    var txBestaat=transacties.some(function(t){return t.id===txId;});
    if(bonBestaat&&txBestaat){
      if(!matchesByBonId[bonId]) matchesByBonId[bonId]=[];
      matchesByBonId[bonId].push(txId);
      matchesByTxId[txId]=bonId;
    }
  });

  // Automatische matching raakt geen bonnen aan die al (deels) handmatig gekoppeld zijn —
  // splitsen van een bon over meerdere transacties kan alleen bewust, via de zoekvelden.
  // Herhalende posten (lease/abonnement) sluiten we uit van automatische matching —
  // die koppel je bewust elke keer opnieuw handmatig aan de nieuwste afschrijving.
  var beschikbareBonnen=bonnen.filter(function(b){return BEKENDE_REKENINGEN.indexOf(b.betaald)>=0&&!matchesByBonId[b.id]&&!b.herhalend;});
  var paren=onthoudenNamen();
  var vast=vasteAdressen();
  var openTx=transacties.filter(function(tx){return tx.type==='af'&&!matchesByTxId[tx.id]&&!tx.status&&!handmatigTxGematcht[tx.id];});

  // Alle mogelijke paren (zelfde bedrag, zelfde bank, datum hooguit 3 dagen verschil).
  // We koppelen het DICHTSTBIJZIJNDE paar eerst: een bon van 23 juli gaat naar de
  // afschrijving van 23 juli, niet naar die van 26 juli die toevallig eerder in de lijst stond.
  function verzamelParen(maxDagen,alleenOnthouden){
    var lijst=[];
    openTx.forEach(function(tx){
      if(matchesByTxId[tx.id]||twijfel[tx.id]) return;
      var genegeerdeBonIds=genegeerd[tx.id]||[];
      beschikbareBonnen.forEach(function(b){
        if(matchesByBonId[b.id]) return;
        if(genegeerdeBonIds.indexOf(b.id)>=0) return; // eerder handmatig ontkoppeld
        if(Math.abs(b.bedrag-tx.bedrag)>0.01) return;
        if(!bankKlopt(b,tx)) return; // de bank moet kloppen
        var v=dagVerschil(b.datum,tx.datum);
        // Vaste adresjes (dagelijkse koffie e.d.): alleen zelfde dag of 1 dag verschil,
        // anders raakt de bon van 3/9 verstrikt met de afschrijving van 6/9.
        var isVast=!!vast[naamSleutel(tx.omschrijving)];
        var max=isVast?Math.min(maxDagen,1):maxDagen;
        if(v===null||v>max) return;
        if(isVast&&v>0&&parseDatumNL(tx.datum)<parseDatumNL(b.datum)) return; // afschrijving vóór de aankoop kan niet
        var onthouden=isOnthouden(paren,b,tx);
        if(alleenOnthouden&&!onthouden) return;
        var opNaam=onthouden||naamLijktOp(b.omschrijving,tx.omschrijving);
        lijst.push({tx:tx,bon:b,dagen:v,opNaam:opNaam});
      });
    });
    // Een bekende/gelijkende naam gaat voor; daarna het kleinste datumverschil.
    lijst.sort(function(a,b){return ((b.opNaam?1:0)-(a.opNaam?1:0))||(a.dagen-b.dagen);});
    return lijst;
  }
  function koppelParen(lijst){
    lijst.forEach(function(p){
      if(matchesByTxId[p.tx.id]||matchesByBonId[p.bon.id]||twijfel[p.tx.id]) return;
      // Even goede alternatieven voor deze transactie (zelfde datumverschil en naam-status)?
      // Dan niet gokken maar als twijfelgeval tonen.
      var gelijk=lijst.filter(function(q){
        return q.tx===p.tx&&q.dagen===p.dagen&&q.opNaam===p.opNaam&&!matchesByBonId[q.bon.id];
      });
      if(gelijk.length>1){
        // Staan er evenveel even goede transacties voor deze bonnen? (bijv. twee koffie
        // op dezelfde dag, twee bonnen) — dan maakt het niet uit welke bij welke: gewoon koppelen.
        var bonIds=gelijk.map(function(q){return q.bon.id;});
        var concurrenten=lijst.filter(function(q){
          return bonIds.indexOf(q.bon.id)>=0&&q.dagen===p.dagen&&!matchesByTxId[q.tx.id]&&!twijfel[q.tx.id];
        }).map(function(q){return q.tx.id;}).filter(function(id,i,arr){return arr.indexOf(id)===i;});
        var bonnenGelijk=gelijk.every(function(q){return q.bon.datum===p.bon.datum;});
        if(!(bonnenGelijk&&concurrenten.length>=gelijk.length)){
          twijfel[p.tx.id]=bonIds;
          return;
        }
      }
      matchesByBonId[p.bon.id]=[p.tx.id];
      matchesByTxId[p.tx.id]=p.bon.id;
    });
  }
  koppelParen(verzamelParen(3,false));
  // Daarna: een eerder gekoppelde naam (zelfde bedrag en bank) mag tot 14 dagen verschil.
  koppelParen(verzamelParen(14,true));

  // Vaste posten: heb je een afschrijving één keer met de hand aan een vaste post gekoppeld,
  // dan gaan volgende afschrijvingen met dezelfde naam er vanzelf aan hangen (ook zonder bedrag).
  var vasteNaam={},vasteBedragen={};
  Object.keys(handmatigeKoppelingen).forEach(function(txId){
    var b=bonnen.find(function(x){return x.id===handmatigeKoppelingen[txId];});
    if(!b||!b.herhalend) return;
    var t=transacties.find(function(x){return x.id===txId;});
    if(!t) return;
    vasteNaam[naamSleutel(t.omschrijving)]=b;
    (vasteBedragen[b.id]=vasteBedragen[b.id]||[]).push(t.bedrag);
  });
  // Het bedrag moet ook ongeveer kloppen (±15%): het bedrag op de bon, of anders de bedragen
  // die je zelf al koppelde. Zo komt een ander contract of een eenmalige betaling bij dezelfde
  // partij er niet aan te hangen.
  function bedragPastBijVastePost(b,bedrag){
    var ref=(b.bedrag>0?[b.bedrag]:[]).concat(vasteBedragen[b.id]||[]);
    if(!ref.length) return false;
    return ref.some(function(r){return Math.abs(bedrag-r)<=Math.max(0.5,r*0.15);});
  }
  if(Object.keys(vasteNaam).length){
    transacties.forEach(function(tx){
      if(tx.type!=='af'||matchesByTxId[tx.id]||handmatigTxGematcht[tx.id]||tx.status) return;
      var b=vasteNaam[naamSleutel(tx.omschrijving)];
      if(!b) return;
      if(BEKENDE_REKENINGEN.indexOf(b.betaald)>=0&&!bankKlopt(b,tx)) return;
      if((genegeerd[tx.id]||[]).indexOf(b.id)>=0) return;
      if(!bedragPastBijVastePost(b,tx.bedrag)) return;
      (matchesByBonId[b.id]=matchesByBonId[b.id]||[]).push(tx.id);
      matchesByTxId[tx.id]=b.id;
      delete twijfel[tx.id];
    });
  }
  twijfelgevallen=twijfel;
  return twijfel;
}
function gekoppeldeTransacties(bonId){
  return (matchesByBonId[bonId]||[]).map(function(txId){
    return transacties.find(function(t){return t.id===txId;});
  }).filter(Boolean);
}
function gekoppeldTotaal(bonId){
  return gekoppeldeTransacties(bonId).reduce(function(s,t){return s+t.bedrag;},0);
}
function isVolledigGematcht(bon){
  if(bon.handmatigGematcht) return true; // handmatig als gematcht gemarkeerd, ongeacht bedrag/koppeling
  if(bon.herhalend) return false; // blijft altijd koppelbaar aan een volgende afschrijving
  var txIds=matchesByBonId[bon.id];
  if(!txIds||!txIds.length) return false;
  // Gelijk bedrag, of de bank schreef méér af dan op de bon staat (fooi): dan is de bon compleet.
  return gekoppeldTotaal(bon.id)>=bon.bedrag-0.01;
}
function kanFooiZijn(bonBedrag,txBedrag){
  var v=(txBedrag||0)-(bonBedrag||0);
  return bonBedrag>0&&v>0.01&&v<=Math.max(FOOI_MIN_RUIMTE,bonBedrag*FOOI_MAX_PROCENT);
}
function fooiBedrag(bon){
  if(!bon||bon.herhalend||bon.handmatigGematcht) return 0;
  var txIds=matchesByBonId[bon.id];
  if(!txIds||!txIds.length) return 0;

function naamLijktOp(a,b){

  var wa=ka.split(' ')[0],wb=kb.split(' ')[0];
  var eerste=function(w){return w.length>=4&&w!=='the'&&w!=='de';};

function onthoudenNamen(){

    if(!tx||!bon) return;

function voorstelVoor(bon,tx,paren,vanuitTx){
  if(!bon||!tx) return null;

    var bankOk=BEKENDE_REKENINGEN.indexOf(bon.betaald)<0||bankKlopt(bon,tx);
    if(isOnthouden(paren,bon,tx)&&bankOk) return {rang:0,reden:'eerder gekoppeld',dagen:0,vast:true};
    if(naamLijktOp(bon.omschrijving,tx.omschrijving)&&bankOk) return {rang:0,reden:'naam lijkt erop',dagen:0,vast:true};
    if(Math.abs((bon.bedrag||0)-(tx.bedrag||0))<=0.01&&bon.bedrag>0&&bankOk) return {rang:1,reden:'zelfde bedrag',dagen:0,vast:true};
    // Onder een afschrijving staan alle vaste posten altijd in de lijst (na de echte voorstellen).
    return vanuitTx?{rang:5,reden:'',dagen:99,vast:true}:null;
  }
  var zelfdeBedrag=Math.abs((bon.bedrag||0)-(tx.bedrag||0))<=0.01;
  var dagen=dagVerschil(bon.datum,tx.datum);
  var bank=bankKlopt(bon,tx);
  if(isOnthouden(paren,bon,tx)&&(dagen===null||dagen<=45)) return {rang:0,reden:'eerder gekoppeld',dagen:dagen};
  if(!bank) return null;
  if(zelfdeBedrag&&dagen!==null&&dagen<=7) return {rang:1,reden:'zelfde bedrag',dagen:dagen};
  if(kanFooiZijn(bon.bedrag,tx.bedrag)&&fooiDatumOk(bon,tx)!==null) return {rang:1,reden:'mogelijk met fooi (+'+fmt(tx.bedrag-bon.bedrag)+')',dagen:dagen+0.5};

  if(naamLijktOp(bon.omschrijving,tx.omschrijving)&&dagen!==null&&dagen<=7) return {rang:3,reden:'lijkt op naam',dagen:dagen};
  if(zelfdeBedrag&&dagen!==null&&dagen<=21) return {rang:4,reden:'zelfde bedrag',dagen:dagen};

function pdfNaarRegels(pdf){

    return pdf.getPage(nr).then(function(page){return page.getTextContent();}).then(function(tc){
      var stukjes=tc.items.filter(function(it){return it.str&&it.str.trim().length;}).map(function(it){
        return {x:it.transform[4],y:it.transform[5],t:it.str.trim()};
      });

      var regels=[];
      stukjes.forEach(function(s){
        var r=regels.length?regels[regels.length-1]:null;
        if(r&&Math.abs(r.y-s.y)<=3){r.items.push(s);}
        else regels.push({y:s.y,items:[s]});
      });
      return regels.map(function(r){
        r.items.sort(function(a,b){return a.x-b.x;});
        return r.items.map(function(i){return i.t;}).join(' ').replace(/\s+/g,' ').trim();
      });
    });

function bepaalAfschriftPeriode(regels,bestandsnaam){
  var beste=null;
  function kandidaat(j,m){
    if(!j||!m||m<1||m>12||j<2000||j>2100) return;
    var sleutel=j*12+m;
    if(!beste||sleutel>beste.sleutel) beste={jaar:j,maand:m,sleutel:sleutel};
  }
  regels.forEach(function(r){
    var re1=/(\d{1,2})\s+([a-zA-Z]{3,9})\.?\s+(20\d{2})/g,m;
    while((m=re1.exec(r))) kandidaat(parseInt(m[3],10),maandNummer(m[2]));
    var re2=/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2})\b/g;
    while((m=re2.exec(r))) kandidaat(parseInt(m[3],10),parseInt(m[2],10));
  });

    var f=(bestandsnaam||'').match(/(20\d{2})[-_ ]?(\d{2})/);
    if(f) kandidaat(parseInt(f[1],10),parseInt(f[2],10));
  }
  if(!beste){var nu=new Date();kandidaat(nu.getFullYear(),nu.getMonth()+1);}
  return beste;
}
function parseVisaPdfRegels(regels,bestandsnaam){
  var periode=bepaalAfschriftPeriode(regels,bestandsnaam);

  var re=new RegExp('^(\\d{1,2})\\s+'+maandRe+'\\s+(\\d{1,2})\\s+'+maandRe+'\\s+(.+?)\\s+(-?[\\d.]+,\\d{2})\\s*(Af|Bij)$','i');

    var m=regel.match(re);
    if(!m) return;
    var dag=parseInt(m[1],10),maand=maandNummer(m[2]);
    if(!maand||dag<1||dag>31) return;
    // Jaar: normaal dat van het afschrift; een maand die "na" de afschriftmaand valt
    // hoort bij het jaar ervoor (bijv. december-transacties op een januari-afschrift).
    var jaar=periode.jaar;
    if(maand>periode.maand+1) jaar=periode.jaar-1;
    var omschrijving=m[5].replace(/\s+/g,' ').trim();

      datum:pad2(dag)+'-'+pad2(maand)+'-'+jaar,
      bedrag:Math.abs(normaliseerBedrag(m[6])),

function toonGroot(src,pdfUrl){

  var alleenOud=inMaand.every(function(t){return !t.afschriftId;});
  var res={aantal:inMaand.length,alleenOud:alleenOud};

// Status van een bankregel.
function txStatus(t){
  var bonId=matchesByTxId[t.id];
  if(bonId!=null&&bonMap[bonId]) return 'bon';
  if(t.status&&STATUS[t.status]) return t.status;
  if(handmatigTxGematcht[t.id]) return 'geenbon'; // oude app: "✅ handmatig gematcht"
  if(twijfelgevallen[t.id]) return 'twijfel';
  if(isPriveRek(t)&&!t.zakelijk) return 'prive-std';
  return 'open';
}
function isKlaar(t){return STATUS[txStatus(t)].klaar;}

// Bon die nog op een afschrijving wacht (bonnenbakje).
function inBakje(b){
  if(b.herhalend||b.handmatigGematcht) return false;
  if((b.betaald||'').toLowerCase().indexOf('contant')>=0) return false;
  return !isVolledigGematcht(b);
}
// Van wanneer tot wanneer lopen de ingelezen bankregels van een rekening?
function bereikVan(rekNaamStr){

  transacties.forEach(function(t){
    if(matchRekening(t.rekening)!==rekNaamStr) return;
    var d=parseDatumNL(t.datum);if(!d) return;
    if(!min||d<min) min=d;if(!max||d>max) max=d;
  });
  return min?{min:min,max:max}:null;
}

  if(fKwartaal) return Math.ceil(m/3)===fKwartaal;

}

}

function kiesStandaardPeriode(){

// ---------- Voorstellen ----------
// Bonnen met een onbekende betaalwijze (bijv. "Anders: …4016", een kaartnummer dat de app
// nog niet kende) mogen bij elke rekening als voorstel verschijnen. Deze versie vervangt
// bankKlopt() uit de oude app (de laatste definitie telt).
function bankKlopt(bon,tx){
  var r=matchRekening(tx.rekening);
  if(!r) return true;
  if(BEKENDE_REKENINGEN.indexOf(bon.betaald)<0&&!isContant(bon)) return true;
  return bon.betaald===r;
}
function onbekendeBetaalwijze(b){return BEKENDE_REKENINGEN.indexOf(b.betaald)<0&&!isContant(b);}
function voorstellenVoorTx(t,paren){
  paren=paren||onthoudenNamen();
  var uit=[];
  var twijfel=twijfelgevallen[t.id]||[];
  bonnen.forEach(function(b){
    if(isContant(b)||b.handmatigGematcht) return;
    if(!b.herhalend&&isVolledigGematcht(b)) return;
    if(twijfel.indexOf(b.id)>=0){uit.push({bon:b,rang:-1,reden:'zelfde bedrag en datum',dagen:0});return;}
    if((genegeerd[t.id]||[]).indexOf(b.id)>=0) return;
    var v=voorstelVoor(b,t,paren,false);
    if(v) uit.push({bon:b,rang:v.rang,reden:v.reden,dagen:v.dagen==null?99:v.dagen});
  });
  uit.sort(function(a,b){return (a.rang-b.rang)||(a.dagen-b.dagen);});
  return uit.slice(0,4);
}
function txWachtOpBon(t){var s=txStatus(t);return t.type==='af'&&(s==='open'||s==='twijfel'||s==='opvragen'||s==='prive-std');}
function voorstellenVoorBon(b,paren){
  paren=paren||onthoudenNamen();
  var uit=[];
  transacties.forEach(function(t){
    if(!txWachtOpBon(t)) return;
    if((genegeerd[t.id]||[]).indexOf(b.id)>=0) return;
    var v=voorstelVoor(b,t,paren,false);
    if(v) uit.push({tx:t,rang:v.rang,reden:v.reden,dagen:v.dagen==null?99:v.dagen});
  });
  uit.sort(function(a,b){return (a.rang-b.rang)||(a.dagen-b.dagen);});
  return uit.slice(0,3);
}
// Zelfde bedrag, andere eigen rekening, af ↔ bij, binnen 5 dagen → eigen overboeking.
function overboekingPartner(t){
  if(!rekNaam(t)) return null;
  var s=txStatus(t);
  if(!(s==='open'||s==='prive-std'||s==='opvragen')) return null;
  var beste=null,bd=99;
  transacties.forEach(function(u){
    if(u.id===t.id||u.type===t.type||!rekNaam(u)||(u.rekening||'')===(t.rekening||'')) return;
    if(Math.abs(u.bedrag-t.bedrag)>0.005) return;
    if(matchesByTxId[u.id]!=null) return;
    if(u.status&&u.status!=='overboeking') return;
    var d=dagVerschil(u.datum,t.datum);
    if(d===null||d>5) return;
    if(d<bd){bd=d;beste=u;}
  });
  return beste;
}

// ---------- Acties op bankregels ----------
function ontkoppelTx(t){
  var bonId=matchesByTxId[t.id];
  if(bonId==null) return;
  if(handmatigeKoppelingen[t.id]===bonId) delete handmatigeKoppelingen[t.id];
  else{
    genegeerd[t.id]=genegeerd[t.id]||[];
    if(genegeerd[t.id].indexOf(bonId)<0) genegeerd[t.id].push(bonId);
  }
}
function zetStatus(t,code,extra){
  ontkoppelTx(t);
  delete t.terugBon;delete t.categorie;
  t.status=code;
  if(extra) Object.keys(extra).forEach(function(k){t[k]=extra[k];});
  // De oude app kent alleen "handmatig gematcht": afgehandelde regels daar ook zo tonen.
  if(STATUS[code].klaar) handmatigTxGematcht[t.id]=true; else delete handmatigTxGematcht[t.id];
  stempel(t);zetDoor(t);
}
function resetTx(t){
  ontkoppelTx(t);
  delete t.status;delete t.terugBon;delete t.categorie;
  delete handmatigTxGematcht[t.id];
  delete t.door;delete t.doorOp;
  stempel(t);
}
function koppel(t,b){
  // Onbekende betaalwijze op de bon? Dan weten we het nu: de rekening van deze bankregel.
  if(onbekendeBetaalwijze(b)&&rekNaam(t)){
    b.betaaldOrigineel=b.betaald;b.betaald=rekNaam(t);stempel(b);bewaarBonnen();
  }
  delete t.status;delete t.terugBon;delete t.categorie;
  delete handmatigTxGematcht[t.id];
  if(genegeerd[t.id]) genegeerd[t.id]=genegeerd[t.id].filter(function(id){return id!==b.id;});
  handmatigeKoppelingen[t.id]=b.id;
  stempel(t);zetDoor(t);
}

  render();
}

// ---------- Opslag (samenvoegen zonder elkaars werk te overschrijven) ----------
// Elke wijziging krijgt een tijdstempel (gewijzigd). Bij opslaan halen we eerst de
// server-versie op en kiezen per regel de nieuwste. Zo kunnen Penny en de opdrachtgever
// tegelijk werken zonder dat de één het werk van de ander wist.
function mergeLijst(lokaal,server,bekend,verwijderd){
  var sMap={},lMap={},uit=[],vanServer={};
  server.forEach(function(x){sMap[x.id]=x;});
  lokaal.forEach(function(x){lMap[x.id]=x;});
  lokaal.forEach(function(x){
    var s=sMap[x.id];
    if(!s){if(bekend[x.id]) return;uit.push(x);return;}   // elders verwijderd / hier nieuw
    if((s.gewijzigd||0)>=(x.gewijzigd||0)){uit.push(s);vanServer[x.id]=true;}
    else uit.push(x);
  });
  server.forEach(function(s){
    if(lMap[s.id]||verwijderd[s.id]) return;
    uit.push(s);vanServer[s.id]=true;
  });
  return {lijst:uit,vanServer:vanServer};
}
function syncTekst(){var el=$('sync');if(el) el.textContent=opslaanBezig?'opslaan…':'';}
function bewaarTransacties(){
  opslaanBezig++;syncTekst();
  txRij=txRij.then(function(){
    return fetch('/api/transacties').then(function(r){return r.json();});
  }).then(function(data){
    var server=(data&&data.transacties)||[];
    var m=mergeLijst(transacties,server,bekendeServerTxIds,verwijderdeTxIds);
    var sh=data.handmatig||{},sg=data.genegeerd||{},sx=data.txGematcht||{};
    var h={},g={},x={};
    m.lijst.forEach(function(t){
      var bron=m.vanServer[t.id]?{h:sh,g:sg,x:sx}:{h:handmatigeKoppelingen,g:genegeerd,x:handmatigTxGematcht};
      if(bron.h[t.id]!==undefined) h[t.id]=bron.h[t.id];
      if(bron.g[t.id]) g[t.id]=bron.g[t.id];
      if(bron.x[t.id]) x[t.id]=bron.x[t.id];
    });
    transacties=m.lijst;handmatigeKoppelingen=h;genegeerd=g;handmatigTxGematcht=x;
    return fetch('/api/transacties',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({transacties:transacties,handmatig:h,genegeerd:g,txGematcht:x})})
      .then(function(r){
        if(!r.ok) throw new Error('opslaan mislukt ('+r.status+')');
        bekendeServerTxIds=idSet(transacties);
      });
  }).catch(function(e){
    console.error(e);zetMelding('⚠️ Opslaan van bankregels lukte niet: '+e.message+'. Herlaad de pagina en probeer opnieuw.','fout');
  }).then(function(){opslaanBezig--;syncTekst();herbereken();render();});
  return txRij;
}

    bonnen=m.lijst;
    return fetch('/api/bonnen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bonnen:bonnen})})
      .then(function(r){

    console.error(e);zetMelding('⚠️ Opslaan van bonnen lukte niet: '+e.message+'. Herlaad de pagina en probeer opnieuw.','fout');
  }).then(function(){opslaanBezig--;syncTekst();herbereken();render();});

function mt940Omschrijving(s){
  var t=(s||'').replace(/\r?\n/g,'');
  if(/\/(NAME|REMI|TRTP)\//.test(t)){
    var naam=((t.match(/\/NAME\/([^/]*)/)||[])[1]||'').trim();
    var remi=((t.match(/\/REMI\/(?:USTD\/\/|STRD\/CUR\/[^/]*\/)?([^/]*)/)||[])[1]||'').trim();
    var trtp=((t.match(/\/TRTP\/([^/]*)/)||[])[1]||'').trim();
    var res=naam||trtp;
    if(remi) res+=(res?' - ':'')+remi;
    return (res||t).replace(/\s+/g,' ').trim().slice(0,140);
  }
  var x=t.replace(/\s+/g,' ').trim();
  var bea=x.match(/^(?:BEA|GEA|eCom)[^ ]*\s+(?:(?:Apple|Google) Pay\s+|Betaalpas\s+|NR:\S+\s+)*(.+?)(?:,PAS\d+|\s+NR:|$)/i);
  if(bea) return bea[1].trim().slice(0,140);
  var naam2=x.match(/Naam:\s*(.+?)(?:\s+(?:Omschrijving|Kenmerk|Machtiging|IBAN|BIC):|$)/i);
  var oms2=x.match(/Omschrijving:\s*(.+?)(?:\s+(?:Kenmerk|Machtiging|IBAN|BIC|Naam):|$)/i);
  if(naam2) return (naam2[1].trim()+(oms2?' - '+oms2[1].trim():'')).slice(0,140);
  return x.slice(0,140);
}
function parseMT940(text){
  var velden=[];
  text.replace(/\r/g,'').split('\n').forEach(function(r){
    var m=r.match(/^:(\d{2}[A-Z]?):(.*)$/);
    if(m) velden.push({tag:m[1],w:m[2]});
    else if(velden.length&&r.trim()&&r.trim()!=='-') velden[velden.length-1].w+='\n'+r;
  });
  var rek='',uit=[],huidige=null,st=Date.now(),i=0;
  velden.forEach(function(v){
    if(v.tag==='25'){rek=laatste4Cijfers(v.w.split('\n')[0]);huidige=null;}
    else if(v.tag==='61'){
      var m=v.w.replace(/\n/g,'').match(/^(\d{2})(\d{2})(\d{2})(\d{4})?(R?[CD])([A-Z])?(\d+,\d*)/);
      if(!m){huidige=null;return;}
      var af=(m[5]==='D'||m[5]==='RC');
      huidige={id:'txmt'+(i++)+'-'+st,datum:m[3]+'-'+m[2]+'-'+(2000+parseInt(m[1],10)),
        bedrag:Math.abs(parseFloat(m[7].replace(',','.'))||0),type:af?'af':'bij',omschrijving:'',rekening:rek};
      uit.push(huidige);
    } else if(v.tag==='86'&&huidige){
      huidige.omschrijving=mt940Omschrijving(v.w);
      huidige=null;
    }
  });
  return uit.filter(function(t){return t.bedrag>0;});
}
// Welke regels stonden er al in (bijv. eerder als CSV ingelezen)? Zelfde rekening, af/bij,
// bedrag en datum (eerst exact, dan 1 dag verschil). De omschrijving telt niet mee:
// die ziet er in een MT940 anders uit dan in een CSV.
function splitsNieuwBestaand(gevonden){
  var geclaimd={},bestaand=[],rest=gevonden.slice();
  [0,1].forEach(function(maxDag){
    rest=rest.filter(function(n){
      var hit=null;
      for(var i=0;i<transacties.length;i++){
        var t=transacties[i];
        if(geclaimd[t.id]||t.type!==n.type||Math.abs(t.bedrag-n.bedrag)>0.005) continue;
        if(t.rekening&&n.rekening&&t.rekening!==n.rekening) continue;
        var d=dagVerschil(t.datum,n.datum);
        if(d===null||d>maxDag) continue;
        hit=t;break;
      }
      if(hit){geclaimd[hit.id]=true;bestaand.push(hit);return false;}
      return true;
    });
  });
  return {nieuw:rest,bestaand:bestaand};
}
function arrayBufferNaarBase64(buf){
  var b=new Uint8Array(buf),s='',stap=0x8000;
  for(var i=0;i<b.length;i+=stap) s+=String.fromCharCode.apply(null,b.subarray(i,i+stap));
  return btoa(s);
}
function decodeerTekst(buf){
  var t=new TextDecoder('utf-8').decode(buf);
  if(t.indexOf('�')>=0) t=new TextDecoder('iso-8859-1').decode(buf);
  return t;
}
function afschriftGekozen(input){
  var f=input.files[0];input.value='';
  if(!f) return;
  zetMelding('⏳ "'+f.name+'" wordt gelezen…','info');render();
  var reader=new FileReader();
  reader.onload=function(e){
    var buf=e.target.result;
    var isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
    var mime=isPdf?'application/pdf':'text/plain';
    var dataUrl='data:'+mime+';base64,'+arrayBufferNaarBase64(buf);
    var bron;
    if(isPdf){
      bron=laadPdfJs().then(function(pdfjsLib){return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;})
        .then(pdfNaarRegels).then(function(regels){return {lijst:parseVisaPdfRegels(regels,f.name),soort:'Visa-PDF'};});
    } else {
      var tekst=decodeerTekst(buf);
      if(/^:61:/m.test(tekst)) bron=Promise.resolve({lijst:parseMT940(tekst),soort:'MT940'});
      else if(isRevolutCSV(tekst)) bron=Promise.resolve({lijst:parseRevolutCSV(tekst),soort:'Revolut-CSV',rek:'REV'});
      else bron=Promise.resolve({lijst:parseBankCSV(tekst),soort:'CSV'});
    }
    bron.then(function(r){
      if(r.rek) r.lijst.forEach(function(t){if(!t.rekening) t.rekening=r.rek;});
      var onbekend=r.lijst.filter(function(t){return !matchRekening(t.rekening);});
      if(r.lijst.length&&onbekend.length){vraagRekening(r,onbekend,f.name,dataUrl);return;}
      importeer(r.lijst,f.name,r.soort,dataUrl);
    })
      .catch(function(err){zetMelding('Het bestand "'+f.name+'" kon niet gelezen worden ('+err.message+').','fout');render();});
  };
  reader.readAsArrayBuffer(f);
}
// Revolut (zakelijk en privé) levert een CSV met o.a. de kolommen State, Amount en Fee.
function isRevolutCSV(tekst){
  var kop=(tekst.split(/\r?\n/)[0]||'').toLowerCase();
  var en=kop.indexOf('state')>=0&&kop.indexOf('amount')>=0&&(kop.indexOf('completed')>=0||kop.indexOf('started')>=0);
  var nl=kop.indexOf('status')>=0&&kop.indexOf('bedrag')>=0&&(kop.indexOf('voltooid')>=0||kop.indexOf('startdatum')>=0);
  return en||nl;
}
function parseRevolutCSV(tekst){
  var regels=tekst.split(/\r?\n/).filter(function(l){return l.trim();});
  var delim=detectDelimiter(regels[0]);
  var kop=splitCsvLine(regels[0],delim).map(function(h){return h.trim().toLowerCase();});
  function kol(test){for(var i=0;i<kop.length;i++) if(test(kop[i])) return i;return -1;}
  var iDatum=kol(function(h){return h.indexOf('completed')>=0||h.indexOf('voltooid')>=0;});
  var iStart=kol(function(h){return h.indexOf('started')>=0||h.indexOf('startdatum')>=0;});
  if(iDatum<0) iDatum=iStart;
  var iBedrag=kol(function(h){return h==='amount'||h==='payment amount'||h==='total amount'||h==='bedrag';});
  if(iBedrag<0) iBedrag=kol(function(h){return (h.indexOf('amount')>=0||h.indexOf('bedrag')>=0)&&h.indexOf('orig')<0&&h.indexOf('balance')<0;});
  var iFee=kol(function(h){return h==='fee'||h.indexOf('fee')===0||h==='kosten';});
  var iState=kol(function(h){return h==='state'||h==='status';});
  var iOms=kol(function(h){return h==='description'||h==='beschrijving'||h==='omschrijving';});
  var iRef=kol(function(h){return h==='reference'||h==='referentie';});
  var iType=kol(function(h){return h==='type';});
  var iCur=kol(function(h){return h==='currency'||h==='payment currency'||h==='valuta';});
  var uit=[],st=Date.now();
  for(var r=1;r<regels.length;r++){
    var c=splitCsvLine(regels[r],delim);
    var state=iState>=0?(c[iState]||'').trim().toUpperCase():'COMPLETED';
    if(state&&state!=='COMPLETED'&&state!=='VOLTOOID') continue; // geweigerd, ongedaan gemaakt of nog bezig: geen echte betaling
    var datum=normaliseerDatum(c[iDatum])||(iStart>=0?normaliseerDatum(c[iStart]):null);
    if(!datum) continue;
    var bedrag=normaliseerBedrag(c[iBedrag]);
    var fee=iFee>=0?Math.abs(normaliseerBedrag(c[iFee])):0;
    var af=bedrag<0||(bedrag===0&&fee>0); // alleen kosten (bijv. Premium-plan) = afschrijving
    var totaal=Math.abs(bedrag)+(af?fee:-fee);
    if(!(totaal>0)) continue;
    var oms=((iOms>=0?c[iOms]:'')||'').trim().replace(/\{xPay\}\s*/g,'').replace(/\{card\}/g,'kaart');
    if(!oms&&iType>=0) oms=(c[iType]||'').trim();
    if(iRef>=0&&c[iRef]&&c[iRef].trim()&&c[iRef].trim()!==oms) oms+=' - '+c[iRef].trim();
    var cur=iCur>=0?(c[iCur]||'').trim().toUpperCase():'';
    if(cur&&cur!=='EUR') oms+=' ('+cur+')';
    uit.push({id:'txrev'+r+'-'+st,datum:datum,bedrag:Math.round(totaal*100)/100,type:af?'af':'bij',omschrijving:oms,rekening:'REV'});
  }
  return uit;
}
// Staat de rekening niet (of onbekend) in het bestand? Dan vragen we het één keer.
function vraagRekening(r,onbekend,naam,dataUrl){
  var nrs={};onbekend.forEach(function(t){if(t.rekening) nrs[t.rekening]=true;});
  var lijst=Object.keys(nrs);
  window._afsWacht={r:r,naam:naam,dataUrl:dataUrl};
  toonModal('<div class="modal-box"><h3>Van welke rekening is dit afschrift?</h3>'+
    '<p class="klein" style="margin-bottom:10px">"'+esc(naam)+'": '+onbekend.length+' regel'+(onbekend.length!==1?'s':'')+
    (lijst.length?' met rekeningnummer eindigend op '+esc(lijst.join(', ')):' zonder rekeningnummer')+'.</p>'+
    '<div class="acties">'+REKENINGEN.filter(function(x){return x.cijfers!=='contant';}).map(function(x){
      return '<button class="knop licht" data-act="kies-afs-rek" data-rek="'+x.cijfers+'">'+esc(x.naam)+'</button>';
    }).join('')+'</div>'+
    '<div class="balk" style="margin-top:12px"><button class="knopje" data-act="modal-dicht">Annuleren</button></div></div>');
}
function importeer(gevonden,naam,soort,dataUrl){
  if(!gevonden.length){
    zetMelding('In "'+naam+'" zijn geen bankregels gevonden. Is het een MT940, een CSV van de bank of een Visa-afschrift van ICS?','fout');
    render();return;
  }
  var afsId='afs'+Date.now(),geupload=nuLabel();
  var r=splitsNieuwBestaand(gevonden);
  r.nieuw.forEach(function(t){
    t.afschriftId=afsId;t.afschriftNaam=naam;t.geupload=geupload;
    t.afsOrigineel=afsId;t.afsOrigineelNaam=naam;stempel(t);
  });
  // Regels die er al in stonden (bijv. eerder als CSV ingelezen): het originele afschrift eraan
  // hangen, en een ontbrekend rekeningnummer aanvullen uit dit bestand.
  r.bestaand.forEach(function(t){
    var gewijzigd=false;
    if(!t.afsOrigineel){t.afsOrigineel=afsId;t.afsOrigineelNaam=naam;gewijzigd=true;}
    if(!t.rekening){
      var nr=gevonden.filter(function(n){return n.type===t.type&&Math.abs(n.bedrag-t.bedrag)<0.005&&n.rekening&&dagVerschil(n.datum,t.datum)<=1;})[0];
      if(nr){t.rekening=nr.rekening;gewijzigd=true;}
    }
    if(gewijzigd) stempel(t);
  });
  transacties=transacties.concat(r.nieuw);
  // Rekening onbekend in het bestand? Even melden.
  var zonderRek=r.nieuw.filter(function(t){return !matchRekening(t.rekening);}).length;
  zetMelding('✓ '+soort+' "'+naam+'": '+r.nieuw.length+' nieuwe regel'+(r.nieuw.length!==1?'s':'')+
    (r.bestaand.length?', '+r.bestaand.length+' stond'+(r.bestaand.length!==1?'en':'')+' er al in':'')+'.'+
    (zonderRek?' Let op: '+zonderRek+' regel'+(zonderRek!==1?'s hebben':' heeft')+' een onbekend rekeningnummer.':'')+
    ' Origineel wordt bewaard voor de boekhouder…','ok');
  // Naar de periode van dit afschrift springen.
  var laatste=null;gevonden.forEach(function(t){var d=parseDatumNL(t.datum);if(d&&(!laatste||d>laatste)) laatste=d;});
  if(laatste){fJaar=laatste.getFullYear();fKwartaal=Math.ceil((laatste.getMonth()+1)/3);fMaand='alle';}
  naWijziging(true,false);
  // Origineel bewaren en controleren of het echt is aangekomen.
  bewaarFoto('afs-'+afsId,dataUrl).then(function(){return haalFoto('afs-'+afsId);}).then(function(terug){
    if(terug!==dataUrl) throw new Error('niet teruggevonden');
    melding.tekst=melding.tekst.replace(' Origineel wordt bewaard voor de boekhouder…',' Origineel bewaard voor de boekhouder ✓');
    render();
  }).catch(function(){
    r.nieuw.concat(r.bestaand).forEach(function(t){if(t.afsOrigineel===afsId){delete t.afsOrigineel;delete t.afsOrigineelNaam;stempel(t);}});
    bewaarTransacties();
    zetMelding('Bankregels ingelezen, maar het originele bestand kon niet bewaard worden. Stuur "'+naam+'" zelf mee naar de boekhouder.','fout');
    render();
  });
}

  bonFormCtx={txId:txId||null};

}
function bonBestandGekozen(input){
  var f=input.files[0];input.value='';

function scanBestand(file,ctx){
  bonFormCtx=ctx||{};
  toonModal('<div class="laden">🔍 De bon wordt uitgelezen…</div>');
  comprimeerVoorVerzending(file,function(dataUrl,mediaType){
    previewSrc=dataUrl;
    fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl.split(',')[1],mediaType:mediaType})})
    .then(function(res){if(!res.ok) return res.text().then(function(t){throw new Error('API fout '+res.status+': '+t);});return res.json();})
    .then(function(data){
      var p=data.result;if(!p) throw new Error('lege respons');
      var bedrag=p.bedrag_incl||0,btw=p.btw_bedrag||0;
      var cijfers=p.rekening_cijfers?String(p.rekening_cijfers).replace(/[^0-9]/g,'').slice(-4):'';
      var her=bepaalBetaaldVia(cijfers,p.datum,bedrag);
      toonBonForm({datum:p.datum||'',tijd:normaliseerTijd(p.tijd),omschrijving:p.omschrijving||'',bedrag:bedrag,btw:btw,
        categorie:CATEGORIEEN.indexOf(p.categorie)>=0?p.categorie:'Algemene kosten',betaald:her.betaald,type:'Zakelijk',
        opmerking:p.opmerking||'',bonCijfers:cijfers},her.hint,null);
    }).catch(function(e){
      toonBonForm({datum:'',bedrag:0,btw:0,categorie:'Algemene kosten',betaald:'BUNQ Zakelijk (7361)',type:'Zakelijk'},'',
        'De bon kon niet automatisch worden uitgelezen ('+e.message+'). Vul hem zelf in.');
    });
  });
}

function bonOpslaan(){
  var ctx=bonFormCtx||{};
  var datum=$('bf-datum').value.trim();
  var nd=normaliseerDatum(datum);
  if(!nd){alert('Vul een geldige datum in (DD-MM-JJJJ).');return;}
  var bedrag=parseAmt($('bf-bedrag').value);
  var gegevens={datum:nd,tijd:normaliseerTijd($('bf-tijd').value),omschrijving:$('bf-oms').value.trim(),bedrag:bedrag,
    btw:parseAmt($('bf-btw').value),categorie:$('bf-cat').value,betaald:$('bf-betaald').value,type:$('bf-type').value,
    opmerking:$('bf-opm').value.trim()};
  var b;
  if(ctx.bonId){
    b=bonMap[ctx.bonId];if(!b) return;
    Object.keys(gegevens).forEach(function(k){b[k]=gegevens[k];});
  } else {
    var dubbel=bonnen.filter(function(x){return x.datum===nd&&Math.abs((x.bedrag||0)-bedrag)<0.01&&!x.herhalend;});
    if(dubbel.length&&!confirm('Er staat al een bon van '+fmt(bedrag)+' op '+nd+' ('+(dubbel[0].omschrijving||'—')+'). Toch opslaan als nieuwe bon?')) return;
    b=gegevens;b.id=Date.now();b.bonCijfers=$('bf-cijfers').value;b.heeftFoto=!!previewSrc;
    b.toegevoegdDoor=gebruiker;
    bonnen.unshift(b);bonMap[b.id]=b;
  }
  stempel(b);
  if(previewSrc&&(!ctx.bonId||!b.heeftFoto)){b.heeftFoto=true;bewaarFoto(b.id,previewSrc).catch(function(){zetMelding('⚠️ De foto van de bon kon niet bewaard worden.','fout');render();});}
  var t=ctx.txId?txMap[ctx.txId]:null;
  if(t) koppel(t,b);
  sluitModal();
  zetMelding(t?'✓ Bon bewaard en gekoppeld.':(ctx.bonId?'✓ Bon bijgewerkt.':'✓ Bon bewaard in het bonnenbakje.'),'ok');
  naWijziging(!!t,true);
}
function verwijderBon(bonId){
  var b=bonMap[bonId];if(!b) return;
  if(!confirm('Bon "'+(b.omschrijving||'—')+'" ('+fmt(b.bedrag)+', '+b.datum+') verwijderen?')) return;
  bonnen=bonnen.filter(function(x){return x.id!==bonId;});
  verwijderdeBonIds[bonId]=true;
  Object.keys(handmatigeKoppelingen).forEach(function(txId){
    if(handmatigeKoppelingen[txId]===bonId){delete handmatigeKoppelingen[txId];if(txMap[txId]) stempel(txMap[txId]);}
  });
  transacties.forEach(function(t){if(t.terugBon===bonId){delete t.terugBon;delete t.status;delete handmatigTxGematcht[t.id];stempel(t);}});
  naWijziging(true,true);
}
function bekijkFoto(bonId){
  haalFoto(bonId).then(function(f){if(f) toonGroot(f); else alert('Bij deze bon is geen foto bewaard.');}).catch(function(){alert('Foto ophalen lukte niet.');});
}

function render(){
  if(!$('inhoud')) return;
  $('naam-chip').textContent='👤 '+(gebruiker||'Wie ben je?');
  renderTabs();
  var html='';
  if(melding) html+='<div class="melding '+melding.soort+'">'+esc(melding.tekst)+' <a href="#" data-act="melding-weg" style="float:right;color:inherit;text-decoration:none">✕</a></div>';
  if(tab==='verwerken') html+=renderVerwerken();
  else if(tab==='bakje') html+=renderBakje();
  else if(tab==='opvragen') html+=renderOpvragen();
  else html+=renderKwartaal();
  $('inhoud').innerHTML=html;
  var zoek=document.querySelector('[data-zoek]');
  if(zoek&&zoek.value) vulZoekresultaten(zoek);
}
function telTeDoen(){return transacties.filter(function(t){return !isKlaar(t);}).length;}
function renderTabs(){
  var nBakje=bonnen.filter(inBakje).length;
  var nOpv=transacties.filter(function(t){return txStatus(t)==='opvragen';}).length;
  var nTodo=telTeDoen();
  var tabs=[['verwerken','Verwerken',nTodo],['bakje','Bonnenbakje',nBakje],['opvragen','Opvragen',nOpv],['kwartaal','Kwartaal',0]];
  $('tabs').innerHTML=tabs.map(function(x){
    return '<button class="tab'+(tab===x[0]?' actief':'')+'" data-act="tab" data-tab="'+x[0]+'">'+x[1]+(x[2]?'<span class="tel">'+x[2]+'</span>':'')+'</button>';
  }).join('');
}
function renderPeriodeBalk(metRek){
  var jaren=beschikbareJaren();

function vulZoekresultaten(input){
  var txId=input.getAttribute('data-tx'),soort=input.getAttribute('data-zoek');
  var doel=document.querySelector('[data-zoekres="'+txId+'"]');
  if(!doel) return;
  var term=input.value.toLowerCase().trim();
  if(!term){doel.innerHTML='';return;}
  var lijst=bonnen.filter(function(b){
    if(soort==='bon'&&(isContant(b)||(!b.herhalend&&isVolledigGematcht(b)))) return false;
    var bs=(b.bedrag||0).toFixed(2);
    return ((b.omschrijving||'')+' '+b.datum+' '+bs+' '+bs.replace('.',',')+' '+(b.categorie||'')).toLowerCase().indexOf(term)>=0;
  });
  lijst=sorteerOpDatumDesc(lijst).slice(0,25);
  var act=soort==='terug'?'terug':'koppel';
  doel.innerHTML=lijst.length?lijst.map(function(b){
    return '<div class="item"><span>'+esc(b.datum)+' · '+esc(b.omschrijving||'—')+' · '+fmt(b.bedrag)+(b.herhalend?' · 🔁':'')+'</span>'+
      '<button class="knopje" data-act="'+act+'" data-tx="'+esc(txId)+'" data-bon="'+b.id+'">'+(act==='terug'?'Kies':'Koppel')+'</button></div>';
  }).join(''):'<div class="klein" style="padding:6px">Geen bon gevonden. Upload hem, of maak er een van deze regel.</div>';
}

function opvraagLijst(){
  return sorteerOpDatumDesc(transacties.filter(function(t){
    var s=txStatus(t);
    if(s==='opvragen') return true;
    return opvragenAlles&&t.type==='af'&&(s==='open'||s==='twijfel')&&inPeriode(t.datum);
  })).reverse();
}
function opvraagTekst(){
  var lijst=opvraagLijst();
  var groepen={};
  lijst.forEach(function(t){(groepen[rekKortT(t)]=groepen[rekKortT(t)]||[]).push(t);});
  var regels=['Bonnen die ik nog mis','('+lijst.length+' stuk'+(lijst.length!==1?'s':'')+', samen '+fmt(lijst.reduce(function(s,t){return s+t.bedrag;},0))+')',''];
  Object.keys(groepen).forEach(function(g){
    regels.push(g+':');
    groepen[g].forEach(function(t){regels.push('• '+t.datum+' · '+(t.omschrijving||'—')+' · '+fmt(t.bedrag));});
    regels.push('');
  });
  regels.push('Kun je van deze betalingen de bon of factuur sturen (foto of mail is prima)? Is iets privé, laat het me dan even weten.');
  return regels.join('\n');
}

    '<div class="balk"><button class="knop" id="pk-knop" data-act="pakketje">📦 Pakketje '+esc(periodeLabel())+'</button>'+

// ---------- Geüploade afschriften (met verwijderen) ----------
var afsAllesTonen=false;
function afschriftGroepen(){
  var g={};
  transacties.forEach(function(t){
    var id=t.afschriftId||'oud';
    var x=g[id]||(g[id]={id:id,naam:id==='oud'?'Eerder ingelezen (zonder naam)':(t.afschriftNaam||'Afschrift'),geupload:t.geupload||'',reks:{},n:0,af:0,bij:0,van:null,tot:null});
    x.n++;x.reks[rekKortT(t)]=true;
    var d=parseDatumNL(t.datum);
    if(d){if(!x.van||d<x.van) x.van=d;if(!x.tot||d>x.tot) x.tot=d;}
  });
  return Object.keys(g).map(function(k){return g[k];}).sort(function(a,b){
    if(a.id==='oud') return 1;if(b.id==='oud') return -1;
    return (+b.id.replace('afs','')||0)-(+a.id.replace('afs','')||0);
  });
}
function kortDatum(d){return d?d.getDate()+' '+MAAND_NAMEN[d.getMonth()]+' '+d.getFullYear():'?';}
function renderAfschriftenLijst(){
  var lijst=afschriftGroepen();
  if(!lijst.length) return '';
  var toon=afsAllesTonen?lijst:lijst.slice(0,8);
  var h='<div class="dag">Geüploade afschriften ('+lijst.length+')</div>';
  toon.forEach(function(g){
    h+='<div class="bon"><div style="min-width:0;flex:1"><div class="oms">📄 '+esc(g.naam)+'</div>'+
      '<div class="sub">'+esc(Object.keys(g.reks).join(', '))+' · '+kortDatum(g.van)+' – '+kortDatum(g.tot)+' · '+g.n+' regel'+(g.n!==1?'s':'')+
      (g.geupload?' · geüpload '+esc(g.geupload):'')+'</div></div>'+
      (g.id==='oud'?'':'<button class="knopje" data-act="afs-weg" data-afs="'+esc(g.id)+'" title="Dit afschrift en zijn regels verwijderen">🗑</button>')+'</div>';
  });
  if(lijst.length>8) h+='<button class="knopje" data-act="afs-alles">'+(afsAllesTonen?'Minder tonen':'Alle '+lijst.length+' tonen')+'</button>';
  return h;
}
function verwijderAfschrift(id){
  var weg=transacties.filter(function(t){return t.afschriftId===id;});
  var gekoppeld=weg.filter(function(t){return matchesByTxId[t.id]!=null||t.status;}).length;
  var g=afschriftGroepen().filter(function(x){return x.id===id;})[0];
  if(!g) return;
  if(!confirm('Afschrift "'+g.naam+'" verwijderen?\n\n'+weg.length+' bankregel'+(weg.length!==1?'s':'')+' ('+kortDatum(g.van)+' – '+kortDatum(g.tot)+') verdwijnen uit de app.'+
    (gekoppeld?'\n'+gekoppeld+' daarvan '+(gekoppeld!==1?'zijn':'is')+' al afgehandeld; die koppelingen worden losgemaakt. De bonnen zelf blijven staan.':'\nBonnen blijven gewoon staan.'))) return;
  var ids={};weg.forEach(function(t){ids[t.id]=true;verwijderdeTxIds[t.id]=true;});
  transacties=transacties.filter(function(t){return !ids[t.id];});
  Object.keys(ids).forEach(function(k){delete handmatigeKoppelingen[k];delete genegeerd[k];delete handmatigTxGematcht[k];});
  // Regels uit een ander afschrift die dit bestand als "origineel" kregen: dat loskoppelen.
  transacties.forEach(function(t){if(t.afsOrigineel===id){delete t.afsOrigineel;delete t.afsOrigineelNaam;stempel(t);}});
  if(openTxId&&ids[openTxId]) openTxId=null;
  zetMelding('✓ Afschrift "'+g.naam+'" verwijderd ('+weg.length+' regels). Je kunt het nu opnieuw uploaden.','ok');
  naWijziging(true,false);
}

// ====================================================================================
// PAKKETJE VOOR DE BOEKHOUDER
// ====================================================================================
function veiligeNaam(s){return (s||'bon').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,40)||'bon';}
function extVan(dataUrl){var m=dataUrl.slice(0,40);return m.indexOf('pdf')>=0?'pdf':(m.indexOf('png')>=0?'png':'jpg');}
function maakPakketje(metZip){
  var knopEl=$(metZip?'pk-knop':'pk-excel'),vg=$('pk-voortgang');
  if(knopEl) knopEl.disabled=true;
  var zet=function(t){if(vg) vg.textContent=t;};
  var txs=transacties.filter(function(t){return inPeriode(t.datum)&&(pkPrive||txStatus(t)!=='prive-std');})
    .sort(function(a,b){return (parseDatumNL(a.datum)||0)-(parseDatumNL(b.datum)||0);});
  var bonIds={};
  txs.forEach(function(t){var b=matchesByTxId[t.id];if(b!=null&&bonMap[b]) bonIds[b]=true;if(t.terugBon&&bonMap[t.terugBon]) bonIds[t.terugBon]=true;});
  var losse=bonnen.filter(function(b){return inPeriode(b.datum)&&(isContant(b)||inBakje(b));});
  losse.forEach(function(b){bonIds[b.id]=true;});
  var bonLijst=Object.keys(bonIds).map(function(id){return bonMap[id];}).filter(Boolean);
  var map='X65P-'+periodeBestand();
  var bestanden={}; // bonId -> pad in ZIP
  var zip=metZip?new JSZip():null;
  var stap=Promise.resolve();
  laadXlsx().then(function(XLSX){
    if(metZip){
      var n=0,metFoto=bonLijst.filter(function(b){return b.heeftFoto;});
      metFoto.forEach(function(b){
        stap=stap.then(function(){
          zet('Bonfoto\'s ophalen… '+(++n)+' van '+metFoto.length);
          return haalFoto(b.id).then(function(f){
            if(!f) return;
            var naam=isoDatum(b.datum)+'_'+veiligeNaam(b.omschrijving)+'_'+(b.bedrag||0).toFixed(2).replace('.',',')+'_'+String(b.id).slice(-4)+'.'+extVan(f);
            zip.file(map+'/Bonnen/'+naam,f.split(',')[1],{base64:true});
            bestanden[b.id]='Bonnen/'+naam;
          }).catch(function(){});
        });
      });
      var afs={};
      txs.forEach(function(t){if(t.afsOrigineel) afs[t.afsOrigineel]=t.afsOrigineelNaam||t.afsOrigineel;});
      var gebruikteNamen={};
      Object.keys(afs).forEach(function(id){
        stap=stap.then(function(){
          zet('Afschriften ophalen…');
          return haalFoto('afs-'+id).then(function(f){
            if(!f) return;
            var naam=afs[id].replace(/[\/\\:]/g,'-');
            if(gebruikteNamen[naam]) naam=naam.replace(/(\.[^.]*)?$/,'-'+id.replace('afs','').slice(-5)+'$1');
            gebruikteNamen[naam]=true;
            zip.file(map+'/Afschriften/'+naam,f.split(',')[1],{base64:true});
          }).catch(function(){});
        });
      });
    }
    return stap.then(function(){
      zet('Excel maken…');
      var wb=maakWerkboek(XLSX,txs,losse,metZip?bestanden:null);
      if(!metZip){XLSX.writeFile(wb,map+'-overzicht.xlsx',{cellDates:true});return;}
      zip.file(map+'/Overzicht-'+periodeBestand()+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx',cellDates:true}));
      zet('ZIP maken…');
      return zip.generateAsync({type:'blob'}).then(function(blob){downloadBlob(blob,map+'.zip');});
    });
  }).then(function(){zet('✓ Klaar — het bestand staat in je downloads.');})
  .catch(function(e){zet('');alert('Het pakketje maken lukte niet ('+e.message+').');})
  .then(function(){if(knopEl) knopEl.disabled=false;});
}
function maakWerkboek(XLSX,txs,losse,bestanden){
  function link(b){
    if(!b) return null;
    if(bestanden&&bestanden[b.id]) return {tekst:bestanden[b.id].replace('Bonnen/',''),url:bestanden[b.id]};
    if(b.driveLink) return {tekst:'Bon in Drive',url:b.driveLink};
    return {tekst:b.heeftFoto?'(foto in de app)':'(geen foto)',url:null};
  }
  function blad(koppen,rijen,geldKols,linkKol,breedtes){
    var ws=XLSX.utils.aoa_to_sheet([koppen].concat(rijen.map(function(r){return r.waarden;})),{cellDates:true});
    for(var r=0;r<rijen.length;r++){
      var dc=ws[XLSX.utils.encode_cell({r:r+1,c:0})];if(dc&&dc.t==='d') dc.z='dd-mm-yyyy';
      geldKols.forEach(function(c){var cel=ws[XLSX.utils.encode_cell({r:r+1,c:c})];if(cel&&cel.t==='n') cel.z='€ #,##0.00';});
      if(linkKol!=null&&rijen[r].link){var lc=ws[XLSX.utils.encode_cell({r:r+1,c:linkKol})];if(lc) lc.l={Target:rijen[r].link,Tooltip:'Open de bon'};}
    }
    ws['!cols']=breedtes.map(function(w){return {wch:w};});
    ws['!autofilter']={ref:ws['!ref']};
    return ws;
  }
  var rijen=txs.map(function(t){
    var s=txStatus(t),b=s==='bon'?bonMap[matchesByTxId[t.id]]:(t.terugBon?bonMap[t.terugBon]:null);
    var l=link(b),fooi=b&&s==='bon'?fooiBedrag(b):0;
    var enkel=b&&!b.herhalend&&gekoppeldeTransacties(b.id).length<=1;
    return {link:l&&l.url,waarden:[
      parseDatumNL(t.datum)||t.datum,rekKortT(t),t.omschrijving||'',
      t.type==='af'?t.bedrag:'',t.type==='bij'?t.bedrag:'',
      STATUS[s].label.replace(/^[^A-Za-zÀ-ÿ]+/,''),
      (b&&b.categorie)||t.categorie||'',
      b&&enkel?(b.btw||0):'',
      l?l.tekst:'',
      b?b.bedrag:'',fooi||'',
      [t.notitie,b&&b.opmerking,b&&b.herhalend?'vaste post':''].filter(Boolean).join(' · '),
      t.door||''
    ]};
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,blad(['Datum','Rekening','Omschrijving (bank)','Af','Bij','Status','Categorie','Btw','Bon / factuur','Bonbedrag','Fooi','Opmerking','Afgehandeld door'],
    rijen,[3,4,7,9,10],8,[11,14,40,11,11,20,26,10,34,11,9,30,14]),'Bankregels');
  var rijen2=sorteerOpDatumDesc(losse).reverse().map(function(b){
    var l=link(b);
    return {link:l&&l.url,waarden:[parseDatumNL(b.datum)||b.datum,b.omschrijving||'',b.bedrag||0,b.btw||0,b.categorie||'',b.betaald||'',
      isContant(b)?'Contant betaald':'Nog geen afschrijving gevonden',l?l.tekst:'',b.opmerking||'']};
  });
  XLSX.utils.book_append_sheet(wb,blad(['Datum','Omschrijving','Bedrag','Btw','Categorie','Betaald via','Reden','Bon','Opmerking'],
    rijen2,[2,3],7,[11,36,11,10,26,20,28,34,26]),'Bonnen zonder bank');
  var open=txs.filter(function(t){return !isKlaar(t);});
  var rijen3=open.map(function(t){return {waarden:[parseDatumNL(t.datum)||t.datum,rekKortT(t),t.omschrijving||'',t.bedrag,t.type==='af'?'Af':'Bij',STATUS[txStatus(t)].label.replace(/^[^A-Za-zÀ-ÿ]+/,'')]};});
  XLSX.utils.book_append_sheet(wb,blad(['Datum','Rekening','Omschrijving (bank)','Bedrag','Af/Bij','Status'],rijen3,[3],null,[11,14,40,11,7,22]),'Nog open');
  return wb;
}
function downloadBackup(){
  var data={gemaakt:new Date().toISOString(),door:gebruiker,bonnen:bonnen,transacties:transacties,handmatig:handmatigeKoppelingen,genegeerd:genegeerd,txGematcht:handmatigTxGematcht};
  downloadBlob(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),'X65P-backup-'+isoDatum(nuLabel().slice(0,10))+'.json');
}

// ====================================================================================
// KLIKKEN EN TYPEN (één centrale afhandeling)
// ====================================================================================
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='modal-achter'){if(e.target===el) sluitModal();return;}
  if(el.tagName==='INPUT'&&el.type!=='checkbox') return;
  if(el.tagName==='SELECT') return;
  if(el.tagName==='A') e.preventDefault();
  var t=txMap[el.getAttribute('data-tx')];
  var bonId=el.getAttribute('data-bon');var b=bonId!=null?bonMap[bonId]:null;
  switch(act){
    case 'tab': tab=el.getAttribute('data-tab');melding=null;openTxId=null;render();window.scrollTo(0,0);break;
    case 'naam': vraagNaam();break;
    case 'naam-kies':
      var n=el.getAttribute('data-naam')||($('naam-input')&&$('naam-input').value.trim());
      if(!n){alert('Vul je naam in.');return;}
      gebruiker=n;bewaarLokaal('x65p-naam',n);sluitModal();render();break;
    case 'melding-weg': melding=null;render();break;
    case 'kwartaal': var k=+el.getAttribute('data-k');fKwartaal=k||null;fMaand='alle';openTxId=null;render();break;
    case 'maand': var m=+el.getAttribute('data-m');fMaand=(fMaand===m?'alle':m);openTxId=null;render();break;
    case 'rek': fRek=el.getAttribute('data-rek');openTxId=null;render();break;
    case 'weergave': fWeergave=el.getAttribute('data-w');openTxId=null;render();break;
    case 'toon-prive': toonPrive=el.checked;render();break;
    case 'opvragen-alles': opvragenAlles=el.checked;render();break;
    case 'pk-prive': pkPrive=el.checked;break;
    case 'open': if(t){openTxId=openTxId===t.id?null:t.id;render();}break;
    case 'afschrift-upload': $('afschrift-input').click();break;
    case 'kies-afs-rek':
      var w=window._afsWacht;if(!w) return;
      var gekozen=el.getAttribute('data-rek');
      w.r.lijst.forEach(function(x){if(!matchRekening(x.rekening)) x.rekening=gekozen;});
      window._afsWacht=null;$('modal').innerHTML='';
      importeer(w.r.lijst,w.naam,w.r.soort,w.dataUrl);break;
    case 'koppel': if(t&&b){koppel(t,b);zetMelding('✓ Gekoppeld: '+(b.omschrijving||'bon')+' ↔ '+(t.omschrijving||'bankregel'),'ok');naWijziging(true,false);}break;
    case 'status':
      if(t){zetStatus(t,el.getAttribute('data-code'));if(STATUS[t.status].klaar&&openTxId===t.id) openTxId=null;naWijziging(true,false);}break;
    case 'geenbon-kies':
      var doel=document.querySelector('[data-geenbon="'+t.id+'"]');
      if(doel) doel.innerHTML='<div class="klein" style="margin:8px 0 4px">Waarom geen bon?</div><div class="acties">'+GEEN_BON_CATS.map(function(c){
        return '<button class="knopje" data-act="geenbon" data-tx="'+esc(t.id)+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div>';
      break;
    case 'geenbon': if(t){zetStatus(t,'geenbon',{categorie:el.getAttribute('data-cat')});openTxId=null;naWijziging(true,false);}break;
    case 'terug-kies':
      var dt=document.querySelector('[data-terug="'+t.id+'"]');
      if(dt){dt.innerHTML='<div class="klein" style="margin:8px 0 4px">Van welke bon is dit de terugbetaling?</div><input placeholder="🔍 Zoek de oorspronkelijke bon…" data-zoek="terug" data-tx="'+esc(t.id)+'"><div class="zoekres" data-zoekres="'+esc(t.id)+'"></div>';
        dt.querySelector('input').focus();}
      break;
    case 'terug': if(t&&b){zetStatus(t,'terug',{terugBon:b.id});openTxId=null;naWijziging(true,false);}break;
    case 'overboeking':
      var p=txMap[el.getAttribute('data-partner')];
      if(t&&p){zetStatus(t,'overboeking');zetStatus(p,'overboeking');openTxId=null;naWijziging(true,false);}break;
    case 'alle-overboekingen':
      var gez={},n2=0;
      transacties.filter(function(x){return inPeriode(x.datum)&&rekOk(x);}).forEach(function(x){
        if(gez[x.id]) return;var q=overboekingPartner(x);
        if(q&&!gez[q.id]){zetStatus(x,'overboeking');zetStatus(q,'overboeking');gez[x.id]=gez[q.id]=true;n2++;}
      });
      zetMelding('✓ '+n2+' eigen overboeking'+(n2!==1?'en':'')+' gemarkeerd.','ok');naWijziging(true,false);break;
    case 'reset': if(t){resetTx(t);naWijziging(true,false);}break;
    case 'zakelijk': if(t){t.zakelijk=true;stempel(t);naWijziging(true,false);}break;
    case 'niet-zakelijk': if(t){delete t.zakelijk;resetTx(t);naWijziging(true,false);}break;
    case 'oms-bewerk':
      if(t){var nw=prompt('Omschrijving van deze bankregel:',t.omschrijving||'');if(nw!==null){t.omschrijving=nw.trim();stempel(t);naWijziging(true,false);}}break;
    case 'bon-upload': startBonUpload(t?t.id:null,false);break;
    case 'bon-nieuw': startBonUpload(null,!!el.getAttribute('data-camera'));break;
    case 'bon-maken': if(t) bonVanTx(t.id);break;
    case 'bon-bewerk': if(b) bewerkBon(b.id);break;
    case 'bon-weg': if(b) verwijderBon(b.id);break;
    case 'bon-contant': if(b){b.betaald='Contant';stempel(b);naWijziging(false,true);}break;
    case 'bon-klopt': if(b){b.handmatigGematcht=true;stempel(b);naWijziging(false,true);}break;
    case 'foto': if(b) bekijkFoto(b.id);break;
    case 'preview-groot': if(previewSrc) toonGroot(previewSrc);break;
    case 'btw-pct':
      var pct=+el.getAttribute('data-pct'),bed=parseAmt($('bf-bedrag').value);
      $('bf-btw').value=(bed-bed/(1+pct/100)).toFixed(2);break;
    case 'bon-opslaan': bonOpslaan();break;
    case 'modal-dicht': sluitModal();break;
    case 'naar-todo': tab='verwerken';fWeergave='todo';fRek='alle';render();break;
    case 'opvragen-kopieer':
      var ta=$('opvraag-tekst');
      (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).catch(function(){ta.select();document.execCommand('copy');})
        .then(function(){zetMelding('✓ Gekopieerd — plak het in WhatsApp of je mail.','ok');render();});
      break;
    case 'opvragen-deel': navigator.share({title:'Bonnen die ik nog mis',text:opvraagTekst()}).catch(function(){});break;
    case 'pakketje': maakPakketje(true);break;
    case 'alleen-excel': maakPakketje(false);break;
    case 'backup': downloadBackup();break;
    case 'afs-weg': verwijderAfschrift(el.getAttribute('data-afs'));break;
    case 'afs-alles': afsAllesTonen=!afsAllesTonen;render();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.getAttribute('data-act')==='jaar'){fJaar=+el.value;openTxId=null;render();}
  if(el.id==='afschrift-input') afschriftGekozen(el);
  if(el.id==='bon-input'||el.id==='bon-camera') bonBestandGekozen(el);
});
document.addEventListener('input',function(e){
  if(e.target.hasAttribute('data-zoek')) vulZoekresultaten(e.target);
});
document.addEventListener('focusout',function(e){
  var el=e.target;
  if(el.getAttribute&&el.getAttribute('data-act-blur')==='notitie'){
    var t=txMap[el.getAttribute('data-tx')];
    if(t&&(t.notitie||'')!==el.value.trim()){t.notitie=el.value.trim();stempel(t);bewaarTransacties();}
  }
});
// Bon plakken (schermafbeelding) of slepen
document.addEventListener('paste',function(e){
  var a=document.activeElement,tag=a&&a.tagName?a.tagName.toLowerCase():'';
  if(tag==='input'||tag==='textarea'||$('modal').innerHTML) return;
  var items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){
    if(items[i].kind==='file'&&(items[i].type.indexOf('image/')===0||items[i].type==='application/pdf')){
      var f=items[i].getAsFile();if(!f) continue;
      e.preventDefault();
      var t=tab==='verwerken'&&openTxId&&txMap[openTxId]&&txMap[openTxId].type==='af'?openTxId:null;
      scanBestand(f,{txId:t});return;
    }
  }
});
document.addEventListener('dragover',function(e){if(e.target.closest&&e.target.closest('#dropzone')) e.preventDefault();});
document.addEventListener('drop',function(e){
  if(!(e.target.closest&&e.target.closest('#dropzone'))) return;
  e.preventDefault();
  var f=e.dataTransfer.files[0];if(f) scanBestand(f,{});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){var o=$('groot-overlay');if(o) o.remove();else if($('modal').innerHTML) sluitModal();}
});

// ---------- Start ----------
gebruiker=leesLokaal('x65p-naam');
laadAlles(true).then(function(){if(!gebruiker) vraagNaam();});

</script>
